# kevins-terminal tmux config. Symlinked to ~/.tmux.conf by install.sh.

# --- Prefix: Option+p -------------------------------------------------------
# M-p covers terminals that send Option as Meta. macOS terminals that don't
# send "π" for Option+p instead, so that is accepted as a second prefix.
unbind C-b
set -g prefix M-p
set -g prefix2 π
bind M-p send-prefix
bind π send-prefix -2

# --- General ----------------------------------------------------------------
set -g mouse on
set -g default-terminal "tmux-256color"
set -s escape-time 10                  # keep Esc snappy, still parse Meta keys
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-interval 60              # the status bar only shows a clock

# --- Titles -----------------------------------------------------------------
# Windows are named after the title the pane's program sets (the zshrc sets
# "dir" or "dir: command"), and the active one is passed up to the terminal tab.
setw -g automatic-rename on
setw -g automatic-rename-format "#{=/28/…:pane_title}"
set -g set-titles on
set -g set-titles-string "#W"

# Splits open in the current pane's directory: | side by side, - stacked.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# --- Neon cyan theme, hot pink accent ----------------------------------------
# colour51 is pure #00ffff in the 256-colour palette, so it looks the same in
# every terminal instead of following the terminal's own (often muted) cyan.
set -g status-style "bg=default,fg=colour51"
set -g status-left "#[bg=colour51,fg=colour16,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=colour51,bold]%H:%M #[bg=colour51,fg=colour16,bold] #h "
setw -g window-status-format "#[fg=colour37] #I:#W "
# The current window is hot pink (colour199, #ff00af) to stand out from the cyan.
setw -g window-status-current-format "#[bg=colour199,fg=colour16,bold] #I:#W "
set -g pane-border-style "fg=colour23"
set -g pane-active-border-style "fg=colour51,bold"
set -g message-style "bg=colour51,fg=colour16,bold"
set -g mode-style "bg=colour51,fg=colour16"
setw -g clock-mode-colour colour51
set -g display-panes-active-colour colour51
set -g display-panes-colour colour23
